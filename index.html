<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         1. BASIC DOCUMENT SETTINGS
         ===================================================== -->

    <!-- Allows normal text, symbols and emojis -->
    <meta charset="UTF-8">

    <!-- Makes the game fit different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>Ocean Quest</title>


    <!-- =====================================================
         2. CSS
         ===================================================== -->

    <style>
        /* =====================================================
           1. RESET
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           2. BODY
           ===================================================== */

        body {
            width: 100vw;
            height: 100vh;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }


        /* =====================================================
           3. INTRO SCREEN
           ===================================================== */

        #intro-screen {

            position: relative;

            width: 100vw;
            height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            /* Ocean background */

            background: linear-gradient(to bottom,
                    #25c6e8,
                    #087da8,
                    #03466d);
        }


        /* =====================================================
           4. WAVE LAYER
           ===================================================== */

        .waves {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 70%;

            overflow: hidden;

            pointer-events: none;
        }


        /* =====================================================
           5. INDIVIDUAL WAVE
           ===================================================== */

        .wave {

            position: absolute;

            left: -50%;

            width: 200%;
            height: 180px;

            border-radius: 45% 55% 45% 55%;

            background: rgba(255, 255, 255, 0.12);

            animation-name: oceanWave;

            animation-timing-function: ease-in-out;

            animation-iteration-count: infinite;

            will-change: transform;
        }


        /* =====================================================
           6. FIRST WAVE
           ===================================================== */

        .wave:nth-child(1) {

            top: 10%;

            height: 200px;

            opacity: 0.30;

            animation-duration: 4s;
        }


        /* =====================================================
           7. SECOND WAVE
           ===================================================== */

        .wave:nth-child(2) {

            top: 32%;

            height: 220px;

            opacity: 0.22;

            animation-duration: 5.5s;

            animation-delay: -1.5s;
        }


        /* =====================================================
           8. THIRD WAVE
           ===================================================== */

        .wave:nth-child(3) {

            top: 55%;

            height: 240px;

            opacity: 0.16;

            animation-duration: 7s;

            animation-delay: -3s;
        }


        /* =====================================================
           9. REALISTIC WAVE MOVEMENT
           ===================================================== */

        @keyframes oceanWave {

            0% {
                transform:
                    translateX(-5%) translateY(0) rotate(0deg);
            }

            25% {
                transform:
                    translateX(4%) translateY(-12px) rotate(0.5deg);
            }

            50% {
                transform:
                    translateX(12%) translateY(4px) rotate(-0.5deg);
            }

            75% {
                transform:
                    translateX(5%) translateY(-8px) rotate(0.4deg);
            }

            100% {
                transform:
                    translateX(-5%) translateY(0) rotate(0deg);
            }
        }


        /* =====================================================
           10. GAME TITLE
           ===================================================== */

        #game-title {

            position: relative;

            z-index: 10;

            color: white;

            font-size: 60px;

            font-weight: bold;

            text-shadow:
                0 4px 10px rgba(0, 0, 0, 0.4);

            margin-bottom: 35px;
        }


        /* =====================================================
           11. PLAY BUTTON
           ===================================================== */

        #play-button {

            position: relative;

            z-index: 10;

            padding: 15px 55px;

            font-size: 22px;

            font-weight: bold;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            background: white;

            color: #05658a;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* =====================================================
           12. PLAY BUTTON HOVER
           ===================================================== */

        #play-button:hover {

            transform: scale(1.08);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.3);
        }


        /* =====================================================
           13. SOUND BUTTON
           ===================================================== */

        #soundToggle {

            position: relative;

            z-index: 10;

            margin-top: 15px;

            padding: 10px 25px;

            font-size: 16px;

            font-weight: bold;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            background: rgba(255, 255, 255, 0.9);

            color: #05658a;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* =====================================================
           14. SOUND BUTTON HOVER
           ===================================================== */

        #soundToggle:hover {

            transform: scale(1.05);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           15. GAME SCREEN
           ===================================================== */

        #game-screen {

            display: none;

            width: 100vw;

            height: 100vh;

            background: #087da8;
        }
    </style>

</head>


<body>


    <!-- =====================================================
         3. BACKGROUND MUSIC

         autoplay = asks the browser to start music
         automatically.

         loop = repeats the music continuously.

         Chrome may block audible autoplay until the
         player interacts with the page.
         ===================================================== -->

    <audio id="background-music" autoplay loop>

        <source src="assets/audio/BackgroundMusic.mp3" type="audio/mpeg">

    </audio>


    <!-- =====================================================
         4. INTRO SCREEN
         ===================================================== -->

    <div id="intro-screen">


        <!-- =================================================
             ANIMATED WATER WAVES
             ================================================= -->

        <div class="waves">

            <!-- Wave 1 -->
            <div class="wave"></div>

            <!-- Wave 2 -->
            <div class="wave"></div>

            <!-- Wave 3 -->
            <div class="wave"></div>

        </div>


        <!-- =================================================
             GAME TITLE
             ================================================= -->

        <h1 id="game-title">
            🌊 OCEAN QUEST
        </h1>


        <!-- =================================================
             PLAY BUTTON
             ================================================= -->

        <button id="play-button">
            PLAY
        </button>


        <!-- =================================================
             SOUND TOGGLE BUTTON
             ================================================= -->

        <button id="soundToggle" type="button">

            🔊 Sound ON

        </button>


    </div>


    <!-- =====================================================
         5. GAME SCREEN

         The actual game will be built here later.

         Planned elements:

         🚢 Ship
         🌊 Ocean
         🐢 Turtle
         🗑️ Garbage
         🪼 Jellyfish
         ☁️ Health
         ===================================================== -->

    <div id="game-screen">

    </div>


    <!-- =====================================================
         6. JAVASCRIPT
         ===================================================== -->

    <script>


        /* =====================================================
           GET HTML ELEMENTS
           ===================================================== */

        // Get intro screen
        const introScreen =
            document.getElementById("intro-screen");


        // Get game screen
        const gameScreen =
            document.getElementById("game-screen");


        // Get PLAY button
        const playButton =
            document.getElementById("play-button");


        // Get background music
        const backgroundMusic =
            document.getElementById("background-music");


        // Get sound toggle button
        const soundToggle =
            document.getElementById("soundToggle");


        /* =====================================================
           TRY TO START MUSIC AUTOMATICALLY
           =====================================================

           This attempts to start the music immediately
           when the page loads.

           Chrome may block it because of autoplay rules.
           ===================================================== */

        backgroundMusic.play()
            .then(function () {

                console.log(
                    "Background music started automatically."
                );

            })
            .catch(function () {

                console.log(
                    "Browser blocked automatic music."
                );

            });


        /* =====================================================
           FIRST INTERACTION FALLBACK
           =====================================================

           If Chrome blocks autoplay, the first click on
           the intro screen will attempt to start the music.

           This means the player doesn't necessarily have
           to click PLAY.
           ===================================================== */

        function startMusicAfterInteraction() {

            backgroundMusic.play()
                .then(function () {

                    console.log(
                        "Music started after user interaction."
                    );

                })
                .catch(function (error) {

                    console.log(
                        "Music could not start:",
                        error
                    );

                });


            // Remove this event after first interaction
            introScreen.removeEventListener(
                "click",
                startMusicAfterInteraction
            );
        }


        introScreen.addEventListener(
            "click",
            startMusicAfterInteraction
        );


        /* =====================================================
           SOUND ON / OFF BUTTON
           =====================================================

           Clicking this button mutes or unmutes the music.
           ===================================================== */

        soundToggle.addEventListener(
            "click",
            function (event) {

                /*
                    Stop this click from also being treated
                    as a general intro interaction.
                */

                event.stopPropagation();


                // If music is currently muted
                if (backgroundMusic.muted) {

                    // Unmute music
                    backgroundMusic.muted = false;

                    // Change button text
                    soundToggle.innerHTML =
                        "🔊 Sound ON";

                }

                // If music is currently playing normally
                else {

                    // Mute music
                    backgroundMusic.muted = true;

                    // Change button text
                    soundToggle.innerHTML =
                        "🔇 Sound OFF";
                }

            }
        );


        /* =====================================================
           PLAY BUTTON
           =====================================================

           PLAY only changes from the intro screen to the
           game screen.

           Music is not started here because we're trying
           to have it playing before PLAY.
           ===================================================== */

        playButton.addEventListener(
            "click",
            function () {

                // Hide intro screen
                introScreen.style.display = "none";


                // Show game screen
                gameScreen.style.display = "block";

            }
        );


    </script>


</body>

</html>
